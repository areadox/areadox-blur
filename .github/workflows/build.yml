name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Tests & Lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Check exports / imports
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          & $dumpbin.FullName /exports dist\areadox-blur\areadox-blur.dll | Select-String obs_module
          & $dumpbin.FullName /imports dist\areadox-blur\areadox-blur.dll | Select-String -Pattern 'obs.dll' -Context 0,3
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=..\dist\areadox-blur" installer\areadox-blur.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: areadox-blur-windows-x64
          path: |
            dist/*.zip
            dist/*-installer.exe

  linux:
    name: Linux x86_64
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: areadox-blur-linux-x86_64
          path: dist/*.tar.gz

  macos:
    name: macOS universal
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: areadox-blur-macos-universal
          path: dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
